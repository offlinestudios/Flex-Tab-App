name: Release checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: flextab-local-test-only
          POSTGRES_DB: flextab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:flextab-local-test-only@127.0.0.1:5432/flextab_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Initialize empty test database
        run: npm run db:initialize
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          FLEXTAB_INITIALIZE_EMPTY_DATABASE: 'yes'
      - run: npm run check
      # Live R2 integration tests require a dedicated test bucket and run separately.
      - run: npm run test:local
      - run: npm run build
